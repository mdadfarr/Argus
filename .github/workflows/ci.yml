name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Argus is macOS-only (AVFoundation, afplay, osascript, security,
    # system_profiler), so the tests run where the app actually runs.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff pip-audit

      - name: Lint
        run: ruff check .

      - name: Test
        # No camera or display on a runner; the suite is built not to need one.
        run: python -m pytest

      - name: Audit dependencies
        # PYSEC-2026-1805 (protobuf) is unfixable while mediapipe pins
        # protobuf <5, and is unreachable here. See requirements.txt.
        run: pip-audit -r requirements.txt --strict --ignore-vuln PYSEC-2026-1805
