<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Argus Timer</title>
<style>
  :root {
    --bg: #0B0B0B;
    --ink: #FAFAFA;
    --accent: #E8231A;
    --muted: #7C7C7C;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: "Helvetica Neue", Inter, -apple-system, system-ui, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    cursor: default;
    user-select: none; -webkit-user-select: none;
    overflow: hidden;
  }
  .wrap {
    height: 100%;
    background: var(--bg);
    border: 1px solid #2E2E2E;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 7px 10px 0;
  }
  .tag {
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .time {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 34px;
    font-weight: 500;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    padding: 0 10px 6px;
    line-height: 1;
  }
  .bar { height: 3px; width: 100%; background: transparent; }
  .fill { height: 3px; width: 0%; background: var(--accent); transition: width 0.4s linear; }

  /* violation: flood the whole surface red */
  body.violation .wrap { background: var(--accent); border-color: var(--accent); }
  body.violation, body.violation .tag, body.violation .time { color: #FFFFFF; }
  body.violation .fill { background: #FFFFFF; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <span class="tag">Argus</span>
      <span class="tag" id="miniState"></span>
    </div>
    <div>
      <div class="time" id="miniTime">--:--</div>
      <div class="bar"><div class="fill" id="miniFill"></div></div>
    </div>
  </div>

<script>
(() => {
  let apiReady = false;
  const timeEl = document.getElementById('miniTime');
  const fillEl = document.getElementById('miniFill');
  const stateEl = document.getElementById('miniState');

  // easy_drag consumes single-click drags, so double-click is the restore
  // gesture (same as the old Tk mini window).
  document.addEventListener('dblclick', () => {
    if (apiReady) window.pywebview.api.exit_mini();
  });

  let sawSession = false;

  async function poll() {
    if (apiReady) {
      try {
        const s = await window.pywebview.api.get_state();
        if (s) {
          timeEl.textContent = s.countdown || '--:--';
          fillEl.style.width =
            `${Math.max(0, Math.min(1, s.progress_frac || 0)) * 100}%`;
          stateEl.textContent = s.in_violation ? 'return' : (s.headline || '');
          document.body.classList.toggle('violation', !!s.in_violation);
          // Only ask to close once a session we actually saw has ended --
          // otherwise this fires every poll while the window sits hidden.
          if (s.session_active) {
            sawSession = true;
          } else if (sawSession) {
            sawSession = false;
            window.pywebview.api.exit_mini();
          }
        }
      } catch (e) { /* backend not ready */ }
    }
    setTimeout(poll, 400);
  }

  window.addEventListener('pywebviewready', () => { apiReady = true; });
  poll();
})();
</script>
</body>
</html>
