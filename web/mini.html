<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Argus Timer</title>
<style>
  :root {
    --bg: #0B0B0B;
    --ink: #FAFAFA;
    --accent: #E8231A;
    --pause: #E8A100;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: transparent; color: var(--ink);
    font-family: "Helvetica Neue", Inter, -apple-system, system-ui, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    cursor: default;
    user-select: none; -webkit-user-select: none;
    overflow: hidden;
  }
  /* One box, nothing in it but the time. The progress bar is flush to the
     bottom edge so it reads as part of the frame rather than as content. */
  .wrap {
    position: relative;
    height: 100%; width: 100%;
    background: var(--bg);
    border: 1px solid #2E2E2E;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .time {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 40px;
    font-weight: 500;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    /* nudge up by half the bar so the number is optically centred in the box */
    transform: translateY(-1px);
  }
  .bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 3px;
  }
  .fill {
    height: 100%; width: 0%;
    background: var(--accent);
    transition: width 0.4s linear;
  }

  body.violation .wrap { background: var(--accent); border-color: var(--accent); }
  body.violation .time { color: #FFFFFF; }
  body.violation .fill { background: #FFFFFF; }

  /* Paused: distinct from both the resting (black) and violation (red) looks,
     so a glance at the popup alone tells the user which state they're in. */
  body.paused .wrap { border-color: var(--pause); }
  body.paused .time { color: var(--pause); }
  body.paused .fill { background: var(--pause); }
  body.paused .badge { display: block; }

  .badge {
    display: none;
    position: absolute;
    top: 6px; left: 0; right: 0;
    text-align: center;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--pause);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge">PAUSED</div>
    <div class="time" id="miniTime">--:--</div>
    <div class="bar"><div class="fill" id="miniFill"></div></div>
  </div>

<script>
(() => {
  let apiReady = false;
  let sawSession = false;
  const timeEl = document.getElementById('miniTime');
  const fillEl = document.getElementById('miniFill');

  // easy_drag consumes single-click drags, so double-click is the restore
  // gesture (same as the old Tk mini window).
  document.addEventListener('dblclick', () => {
    if (apiReady) window.pywebview.api.exit_mini();
  });

  async function poll() {
    if (apiReady) {
      try {
        const s = await window.pywebview.api.get_state();
        if (s) {
          timeEl.textContent = s.countdown || '--:--';
          fillEl.style.width =
            `${Math.max(0, Math.min(1, s.progress_frac || 0)) * 100}%`;
          document.body.classList.toggle('violation', !!s.in_violation);
          document.body.classList.toggle('paused', s.state === 'INTERRUPTED');
          if (s.session_active) {
            sawSession = true;
          } else if (sawSession) {
            sawSession = false;
            window.pywebview.api.exit_mini();
          }
        }
      } catch (e) { /* backend not ready */ }
    }
    setTimeout(poll, 400);
  }

  window.addEventListener('pywebviewready', () => { apiReady = true; });
  poll();
})();
</script>
</body>
</html>
